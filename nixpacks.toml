[phases.setup]
nixPkgs = ["nodejs_20", "python311"]

[phases.install]
cmds = [
  "npm install -g pnpm",
  "cd frontend && pnpm install --frozen-lockfile",
  "cd backend && pip install -r requirements.txt"
]

[phases.build]
cmds = [
  "cd frontend && pnpm build",
]

[start]
cmd = "cd backend && uvicorn main:app --host 0.0.0.0 --port $PORT"
